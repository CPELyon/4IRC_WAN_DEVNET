---
site: CPE-PARS
code: pars

switches:
  - hostname: ESW-PARS
    platform: ios
    model: c3725
    trunks:
      - FastEthernet1/0
    access_ports:
      - interface: FastEthernet1/2
        vlan: 10
      - interface: FastEthernet1/3
        vlan: 20

routers:
  - hostname: R1-PARS
    platform: ios
    model: c7200
    loopback: 10.255.0.31/32
    lan_interface: GigabitEthernet0/0
    wan:
      - interface: Serial1/0
        ip: 10.0.0.22/30
        peer: CORE-1
      - interface: Serial1/1
        ip: 10.0.0.26/30
        peer: CORE-2
    ips:
      10: 172.16.50.254/24
      20: 172.16.60.254/24

vlans:
  - id: 10
    name: teacher
    subnet: 172.16.50.0/24
    gateway: 172.16.50.254
  - id: 20
    name: student
    subnet: 172.16.60.0/24
    gateway: 172.16.60.254
